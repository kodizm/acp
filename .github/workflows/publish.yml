name: Publish to npm

# OIDC-based Trusted Publisher path: tag push triggers a build +
# publish, npm registry verifies the GitHub Actions OIDC token
# against the configured Trusted Publisher (kodizm / acp /
# publish.yml). No static npm token, no OTP prompt.
#
# Manual fallback: workflow_dispatch lets a maintainer publish a
# specific commit without tagging (useful for hotfix dry-runs that
# go through CI but don't pollute git history).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for the npm OIDC trust handshake

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck (src only)
        run: bun run typecheck:src

      - name: Verify OIDC auth
        run: |
          echo "npm version: $(npm --version)"
          echo "Trying npm whoami via OIDC..."
          npm whoami --registry=https://registry.npmjs.org/ || true

      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --provenance --access public
