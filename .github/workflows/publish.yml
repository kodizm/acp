name: Publish to npm

# OIDC-based Trusted Publisher path: tag push triggers a build +
# publish. The npm registry verifies the GitHub Actions OIDC token
# against the configured Trusted Publisher (kodizm / acp /
# publish.yml). No static NPM_TOKEN, no OTP prompt, no NODE_AUTH_TOKEN.
#
# Requirements per https://docs.npmjs.com/trusted-publishers:
#   - npm CLI >= 11.5.1
#   - Node >= 22.14.0
#   - Public GitHub-hosted runner (id-token: write)
#   - Package's Publishing access setting must allow OIDC
#     (NOT "Require 2FA or granular token with bypass 2fa enabled";
#      use "Require 2FA and disallow tokens" or "2FA not required")

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for the npm OIDC trust handshake

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump npm to OIDC-capable version
        run: |
          npm install -g npm@latest
          echo "node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck (src only)
        run: bun run typecheck:src

      - name: Publish via OIDC
        # Trusted Publisher auto-attaches provenance + handles auth.
        # NO NODE_AUTH_TOKEN env: presence of a token would force
        # classic bearer auth and skip the OIDC exchange.
        run: npm publish --access public
